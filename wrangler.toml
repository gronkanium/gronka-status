name = "gronka-status"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "status.gronka.dev", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "gronka-status"
database_id = "00000000-0000-0000-0000-000000000000"
